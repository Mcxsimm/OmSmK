<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OmSmK — Pilotage de chantiers</title>
  <meta name="description" content="Pilotage de chantiers d'étanchéité et de façade : BTE, avancement par phase, saisie terrain, journal, réserves, synchronisation d'équipe.">
  <meta name="theme-color" content="#0e2340">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème choisi par l'utilisateur, appliqué avant l'affichage (évite un flash)
    try { const t = localStorage.getItem('omsmk_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_e) { /* stockage indisponible */ }
  </script>

  <!-- Bibliothèques embarquées (fonctionnent hors-ligne) -->
  <script src="vendor/xlsx.full.min.js" defer></script>
  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
  <script src="vendor/qrcode.min.js" defer></script>
  <script src="vendor/supabase.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" data-nav="journee" aria-label="Accueil"><span class="logo-mark">OS</span><span class="logo-text">OmSmK</span></button>
      <button class="chantier-switch" id="chantierSwitch" aria-haspopup="listbox" title="Changer de chantier">
        <span data-icone="building-2"></span><span class="cs-nom" id="chantierNom">—</span><span data-icone="chevron-down"></span>
      </button>
      <nav class="espaces" id="espaces" aria-label="Espaces"></nav>
      <div class="top-actions">
        <button class="btn ghost icon" id="searchBtn" aria-label="Rechercher (Ctrl+K)" title="Rechercher et aller vite (Ctrl+K)"><span data-icone="search"></span></button>
        <button class="btn primary icon creer-btn" data-act="creer" aria-label="Créer" title="Créer : pointage, photo, action, réserve…"><span data-icone="plus"></span></button>
        <button class="sync-pill" id="syncPill" title="Synchronisation en ligne"><span class="dot"></span><span class="lbl">Local</span></button>
        <button class="btn ghost icon" id="themeBtn" aria-label="Changer de thème" title="Thème clair / sombre"><span data-icone="moon"></span></button>
        <button class="avatar-btn" id="userBtn" aria-label="Mon compte"><span class="avatar">?</span></button>
      </div>
    </header>
    <nav class="subnav" id="subnav" aria-label="Pages de l'espace"></nav>
    <main class="content" id="view"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation"></nav>
  </div>
  <input type="file" id="phGalerieInput" accept="image/*" multiple hidden data-change="photosGalerie">

  <div id="modalRoot"></div>
  <div id="popRoot"></div>
  <div class="viz-tip" id="vizTip" role="tooltip"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="printArea" class="hidden"></div>

  <script src="js/config.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/referentiel.js"></script>
  <script src="js/calculs.js"></script>
  <script src="js/synchro.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/graphiques.js"></script>
  <script src="js/app.js"></script>
  <script src="js/finances.js"></script>
  <script src="js/pointage.js"></script>
  <script src="js/planning.js"></script>
  <script src="js/coordination.js"></script>
  <script src="js/securite.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/cockpit.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/pv.js"></script>
  <script src="js/rapports.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/charge.js"></script>
  <script src="js/devis.js"></script>
  <script src="js/preparation.js"></script>
  <script src="js/bilan.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/demarrage.js"></script>
</body>
</html>
